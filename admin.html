<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - Digital Pathshala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body class="page-in">

<div class="live-bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grid"></span>
</div>

<!-- LOGIN -->
<div id="loginBox" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100">
  <div class="pay-wrap" style="max-width:400px">
    <h2 class="section-title" style="font-size:1.6rem">Admin <span class="red">Login</span></h2>
    <div class="divider"></div>
    <input type="text" id="admUser" placeholder="Username" style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#f1f5f9;color:#1e293b;font-family:inherit;font-size:1rem;margin:14px 0" />
    <input type="password" id="admPass" placeholder="Password" style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#f1f5f9;color:#1e293b;font-family:inherit;font-size:1rem;margin:14px 0" />
    <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">Login</button>
    <p id="loginErr" style="color:#ef4444;margin-top:10px;font-size:.9rem"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;padding:100px 20px 40px;max-width:1100px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px">
    <h2 class="section-title" style="font-size:1.8rem;text-align:left">Admin <span class="red">Dashboard</span></h2>
    <button class="btn btn-ghost" onclick="adminLogout()">Logout</button>
  </div>
  <div class="about-grid" style="margin-bottom:30px">
    <div class="card"><h3>Total Admissions</h3><p style="font-size:2rem;color:var(--red);font-weight:900" id="admCount">0</p></div>
    <div class="card"><h3>Today</h3><p style="font-size:2rem;color:var(--red);font-weight:900" id="admToday">0</p></div>
    <div class="card"><h3>Classes</h3><p style="font-size:2rem;color:var(--red);font-weight:900">9th &amp; 10th</p></div>
  </div>
  <h3 style="color:var(--red);margin-bottom:12px">Admission Records</h3>
  <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:700px">
      <thead><tr style="background:var(--red);color:#fff">
        <th style="padding:10px;border:1px solid var(--border)">#</th>
        <th style="padding:10px;border:1px solid var(--border)">Student</th>
        <th style="padding:10px;border:1px solid var(--border)">Class</th>
        <th style="padding:10px;border:1px solid var(--border)">School</th>
        <th style="padding:10px;border:1px solid var(--border)">Father</th>
        <th style="padding:10px;border:1px solid var(--border)">Email</th>
        <th style="padding:10px;border:1px solid var(--border)">Mobile</th>
        <th style="padding:10px;border:1px solid var(--border)">Date</th>
      </tr></thead>
      <tbody id="admTable" style="color:var(--grey)"></tbody>
    </table>
  </div>
  <div style="margin-top:24px">
    <h3 style="color:var(--red);margin-bottom:12px">Upload Image to Gallery</h3>
    <div class="pay-wrap" style="max-width:420px">
      <input type="file" id="imgFile" accept="image/*" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#f1f5f9;color:#1e293b;margin-bottom:12px" />
      <button class="btn btn-primary" style="width:100%" onclick="uploadImageToGallery()">Upload Image</button>
      <div id="imgUrl" style="margin-top:10px;font-size:.8rem;color:var(--grey);word-break:break-all"></div>
    </div>
  </div>
  <div style="margin-top:20px">
    <button class="btn btn-primary" onclick="clearAdmissions()">Clear All Records</button>
    <button class="btn btn-ghost" style="margin-left:10px" onclick="exportAdmissions()">Export JSON</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
  function adminLogin(){
    const u=document.getElementById('admUser').value.trim();
    const p=document.getElementById('admPass').value.trim();
    if(u==='digitalpathshala' && p==='dp2026'){
      sessionStorage.setItem('adminLogged','1');
      showDashboard();
    } else {
      document.getElementById('loginErr').textContent='Invalid username or password';
    }
  }
  function showDashboard(){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dashboard').style.display='block';
    renderAdmissions();
  }
  function adminLogout(){
    sessionStorage.removeItem('adminLogged');
    location.reload();
  }
  function getAdmissions(){
    try { return JSON.parse(localStorage.getItem('admissions')||'[]'); } catch(e){ return []; }
  }
  async function renderAdmissions(){
    let list=getAdmissions();
    if (typeof sb !== 'undefined' && sb) {
      const remote=await loadAdmissionsFromSupabase();
      if (remote.length) list=remote;
    }
    document.getElementById('admCount').textContent=list.length;
    const today=new Date().toDateString();
    document.getElementById('admToday').textContent=list.filter(a=>new Date(a.date||a.created_at).toDateString()===today).length;
    const tb=document.getElementById('admTable');
    tb.innerHTML=list.map((a,i)=>`<tr>
      <td style="padding:10px;border:1px solid var(--border)">${i+1}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.name||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.cls||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.school||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.fname||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.femail||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.mobile||''}</td>
      <td style="padding:10px;border:1px solid var(--border)">${a.date||a.created_at||''}</td>
    </tr>`).join('');
  }
  async function uploadImageToGallery(){
    const f=document.getElementById('imgFile').files[0];
    if(!f){showToast('Select an image');return;}
    const name=Date.now()+'_'+f.name;
    const url=await uploadImage(f,name);
    if(url){document.getElementById('imgUrl').innerHTML='Uploaded: <a href="'+url+'" target="_blank" style="color:var(--red)">'+url+'</a>';showToast('Image uploaded!');}
  }
  function clearAdmissions(){
    if(confirm('Clear all admission records?')){ localStorage.removeItem('admissions'); renderAdmissions(); showToast('Cleared'); }
  }
  function exportAdmissions(){
    const data=JSON.stringify(getAdmissions(),null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='admissions.json';a.click();
    URL.revokeObjectURL(url);
  }
  if(sessionStorage.getItem('adminLogged')==='1'){ showDashboard(); }
  // enter key login
  document.addEventListener('keydown',e=>{ if(e.key==='Enter' && document.getElementById('loginBox').style.display!=='none') adminLogin(); });
</script>
</body>
</html>
